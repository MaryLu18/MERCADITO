<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1d24">
<title>Mercadito – componentes electrónicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== 1. TOKENS: paleta del tema oscuro de referencia (grafito + violeta, azul y naranja de acento) ========== */
:root{
  color-scheme:dark;
  --bg:#1b1d24; --panel:#23262f; --panel2:#2b2e3a; --line:rgba(255,255,255,.08);
  --ink:#eef0f7; --muted:#9aa0b4; --accent:#6f5cf2; --accent2:#a99bff; --blue:#4e8dff; --orange:#ff7a4d; --pink:#f08fd0;
  --grad:linear-gradient(135deg,#6f5cf2,#8f7bff);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 15px/1.55 var(--font);background:radial-gradient(1100px 560px at 85% -8%,rgba(111,92,242,.20),transparent 60%),radial-gradient(800px 500px at -5% 40%,rgba(240,143,208,.07),transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1,h2,h3{font-family:var(--font);margin:0;line-height:1.1}
.meta{color:var(--muted);font-size:.88rem;margin:0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:500;transition:.2s}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--grad);border:0;font-weight:600;color:#fff;box-shadow:0 8px 22px rgba(111,92,242,.35)}
.btn.primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.block{width:100%;padding:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.pill{display:inline-block;background:var(--grad);padding:3px 12px;border-radius:99px;font-size:.74rem;font-weight:600;color:#fff}

/* ========== 2. CABECERA: slogan en movimiento + menú de categorías ========== */
header{position:sticky;top:0;z-index:30;background:rgba(27,29,36,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.marquee{background:var(--grad);overflow:hidden;height:34px;display:flex;align-items:center}
.track{display:flex;width:max-content;animation:marq 34s linear infinite}
.track span{padding:0 26px;font-weight:600;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;color:#fff}
@keyframes marq{to{transform:translateX(-50%)}}
.bar{max-width:1240px;margin:0 auto;padding:10px 20px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
.logo{font:700 1.25rem var(--font);color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;user-select:none}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:1rem}
.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px}   /* si agregas más categorías, el menú pasa a otra línea */
.mi{position:relative;background:none;border:0;color:var(--muted);font:500 .95rem var(--font);padding:8px 12px;border-radius:10px;transition:color .2s,background .2s}
.mi::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--accent2);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.mi:hover{color:var(--ink)}
.mi:hover::after{transform:scaleX(1);transform-origin:right}   /* la línea entra desde la derecha */
.mi[aria-current="page"]{color:var(--accent2);background:rgba(111,92,242,.18);font-weight:600}   /* categoría activa */
.cartbtn{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ========== 3. INICIO (lobby) ========== */
.home{position:relative;min-height:calc(100vh - 118px);display:grid;place-items:center;text-align:center;overflow:hidden;padding:40px 20px}
.hc{position:relative;z-index:2}
.home h1{font-weight:700;font-size:clamp(2.4rem,7vw,5.2rem);letter-spacing:-.02em;margin-bottom:30px}
.home h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cta{border:0;border-radius:14px;padding:15px 38px;background:var(--grad);color:#fff;font:600 1rem var(--font);box-shadow:0 12px 34px rgba(111,92,242,.5);transition:.2s}
.cta:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(111,92,242,.65)}
.orb,.ring,.gem{position:absolute;pointer-events:none;animation:float 7s ease-in-out infinite}
.orb{border-radius:50%;background:radial-gradient(circle at 30% 26%,#ffd6f6 0,#c58bff 24%,#7a5cf5 56%,#2b2078 100%);box-shadow:0 30px 60px rgba(111,92,242,.35)}
.ring{border-radius:50%;background:conic-gradient(from 200deg,#f6a9e0,#8f7bff,#5a46e0,#f6a9e0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 30px),#000 calc(100% - 29px));mask:radial-gradient(farthest-side,transparent calc(100% - 30px),#000 calc(100% - 29px))}
.gem{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#ffb199,#ff6a5c);transform:rotate(25deg)}
@keyframes float{50%{translate:0 -16px}}

/* ========== 4. CATEGORÍA: banner, búsqueda y productos ========== */
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 70px}
.banner{position:relative;border-radius:22px;overflow:hidden;height:clamp(170px,26vw,280px);background:var(--panel);border:1px solid var(--line)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,29,36,.88),rgba(27,29,36,.1) 72%)}
.btxt{position:absolute;left:clamp(18px,4vw,40px);bottom:clamp(16px,3vw,30px);z-index:1}
.btxt h1{font-weight:700;font-size:clamp(1.8rem,5vw,3.1rem);margin:8px 0 4px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search:focus-within{border-color:var(--accent2)}
.search input{flex:1;min-width:0;background:none;border:0;padding:12px 0;outline:0}
select{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:rgba(169,155,255,.5);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer;background:var(--panel2)}
.card .in{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:.98rem;font-weight:600;cursor:pointer;line-height:1.3}
.price{font-weight:700;font-size:1.2rem}
.price.big{font-size:1.7rem}
.stk{font-size:.84rem;color:var(--muted)}
.stk.low{color:var(--orange);font-weight:600}
.card .btn{margin-top:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 0}

/* ========== 5. VENTANAS, CARRITO Y AVISOS ========== */
dialog{border:1px solid var(--line);border-radius:22px;padding:0;width:min(660px,calc(100% - 24px));background:var(--panel);color:var(--ink);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,9,14,.7);backdrop-filter:blur(3px)}
.mbody{padding:24px;display:grid;gap:14px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--panel2);width:36px;height:36px;border-radius:50%}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.detail #mainImg{width:100%;border-radius:16px;aspect-ratio:1;object-fit:cover;background:var(--panel2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:56px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.dinfo{display:grid;gap:10px;align-content:start}
.dinfo p{margin:0;color:#c8ccdb}
label{display:grid;gap:4px;font-weight:500;font-size:.9rem}
input,textarea{padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
.err{color:var(--orange);font-size:.88rem;min-height:1.2em}
.qr{width:min(260px,100%);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:16px;margin:0 auto;display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--panel2);width:32px;height:32px}
.qty span{min-width:30px;text-align:center}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(410px,100%);background:var(--panel);z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5);border-left:1px solid var(--line)}
#cart.open{transform:none}
#veil{position:fixed;inset:0;background:rgba(8,9,14,.65);z-index:35;display:none}
#veil.on{display:block}
#cart .mhead{padding:18px 20px;border-bottom:1px solid var(--line)}
#items{flex:1;overflow:auto;padding:8px 20px}
.row{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--panel2)}
.row b{display:block;font-weight:600;font-size:.92rem}
.rm{border:0;background:none;color:var(--orange);font-size:.8rem;padding:0;margin-top:4px}
.sum{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-weight:700;font-size:1.2rem;margin-top:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--panel2);border:1px solid var(--accent);padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:820px){
  .bar{grid-template-columns:1fr auto}
  .menu{grid-column:1/-1;order:3;padding-bottom:4px}
  .home{min-height:calc(100vh - 160px)}
  .detail{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <!-- Slogan: marquee infinito (rectángulo delgado de lado a lado) -->
  <div class="marquee" role="text" aria-label="El voltaje que necesitan tus proyectos"><div class="track" id="track" aria-hidden="true"></div></div>
  <div class="bar">
    <a class="logo" href="#" aria-label="Mercadito, inicio"><i>⚡</i>Mercadito</a>
    <nav class="menu" id="menu" aria-label="Categorías"></nav>
    <button class="cartbtn" id="btnCart" aria-label="Abrir carrito">🛒<span class="badge" id="count" hidden>0</span></button>
  </div>
</header>

<main>
  <!-- INICIO: se muestra mientras no haya categoría seleccionada -->
  <section class="home" id="home">
    <span class="orb" style="width:190px;height:190px;left:6%;top:14%"></span>
    <span class="orb" style="width:96px;height:96px;right:12%;top:12%;animation-delay:-2s"></span>
    <span class="ring" style="width:200px;height:200px;left:14%;bottom:8%;animation-delay:-4s;rotate:-18deg"></span>
    <span class="orb" style="width:60px;height:60px;right:20%;bottom:16%;animation-delay:-1s"></span>
    <span class="gem" style="right:7%;bottom:34%;animation-delay:-3s"></span>
    <div class="hc">
      <h1>¿Qué necesitas <span>hoy?</span></h1>
      <button class="cta" data-go="Todo">Ver artículos</button>
    </div>
  </section>

  <!-- CATEGORÍA: banner, búsqueda y productos -->
  <section class="wrap" id="catview" hidden>
    <div class="banner">
      <img id="bimg" alt="">
      <div class="btxt"><span class="pill">Categoría</span><h1 id="btitle"></h1><p class="meta" id="bcount"></p></div>
    </div>
    <div class="tools">
      <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Buscar en esta categoría…" aria-label="Buscar en esta categoría"></label>
      <select id="sort" aria-label="Ordenar"><option value="">Ordenar: relevancia</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<dialog id="dlgProd"><div class="mbody" id="prodBody"></div></dialog>

<dialog id="dlgPay"><div class="mbody" style="text-align:center">
  <div class="mhead"><h2>Escanea para pagar</h2><button class="x" data-close aria-label="Cerrar">✕</button></div>
  <div class="price big" id="payTotal"></div>
  <img id="payQr" class="qr" alt="Código QR para pagar">
  <p class="meta" id="payHint"></p>
  <label style="text-align:left">Tu nombre<input id="payName" maxlength="60" autocomplete="name"></label>
  <label style="text-align:left">WhatsApp o teléfono<input id="payPhone" maxlength="30" inputmode="tel" autocomplete="tel"></label>
  <button class="btn primary block" id="paid">Ya realicé el pago</button>
</div></dialog>

<div id="veil"></div>
<aside id="cart" aria-label="Carrito de compras">
  <div class="mhead"><h2>Tu carrito</h2><button class="x" id="cartClose" aria-label="Cerrar carrito">✕</button></div>
  <div id="items"></div>
  <div class="sum" id="sum"></div>
</aside>
<div id="toast" role="status"></div>

<script>
/* ========== A. DATOS Y UTILIDADES ========== */
const FREE_SHIP = 200000, SHIP = 12000;
// Categorías por defecto (el administrador puede cambiarlas, añadir más y poner su imagen desde el portal).
// "Todo" no es una categoría real: es el botón que muestra los artículos de todas.
let CATS = ['Resistencias','Diodos','LEDs','Transistores'], CATIMG = {}, qrImg = '';
const SLOGAN = 'El voltaje que necesitas tus proyectos';
// Catálogo de ejemplo: solo se usa si la página se abre sin servidor (modo demostración)
const SEED = [
  {id:1,title:'Resistencia 1 kΩ 1/4 W (pack x20)',price:3500,cat:'Resistencias',stock:50,desc:'Película de carbón, tolerancia 5 %. Pack de 20 unidades.'},
  {id:2,title:'Resistencia 10 kΩ 1/4 W (pack x20)',price:3500,cat:'Resistencias',stock:40,desc:'Película de carbón, tolerancia 5 %. Pack de 20 unidades.'},
  {id:3,title:'Diodo 1N4007 (pack x10)',price:3000,cat:'Diodos',stock:30,desc:'Rectificador de 1 A y 1000 V. Pack de 10 unidades.'},
  {id:4,title:'Diodo Zener 5.1 V (pack x5)',price:2500,cat:'Diodos',stock:3,desc:'Zener de 0.5 W. Pack de 5 unidades.'},
  {id:5,title:'LED rojo 5 mm (pack x20)',price:4000,cat:'LEDs',stock:60,desc:'Difuso, 20 mA. Pack de 20 unidades.'},
  {id:6,title:'LED RGB 5 mm cátodo común',price:5000,cat:'LEDs',stock:0,desc:'Cuatro patas, colores rojo, verde y azul.'},
  {id:7,title:'Transistor 2N2222 NPN (pack x5)',price:3000,cat:'Transistores',stock:25,desc:'Encapsulado TO-92, 800 mA. Pack de 5 unidades.'},
  {id:8,title:'Transistor BC547 NPN (pack x10)',price:3500,cat:'Transistores',stock:35,desc:'Propósito general, TO-92. Pack de 10 unidades.'}
];
const mem = {};
const store = {   // localStorage con respaldo en memoria
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = {products:[], cart:store.get('mc_cart', {}), view:'home', q:'', sort:''};   // cart: { idProducto: cantidad }
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = id => state.products.find(p => p.id === id);
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
function stockOf(p){ return p.stock === undefined ? 10 : p.stock; }
function stockLabel(p){ const s = stockOf(p); return s < 1 ? 'Agotado' : s === 1 ? 'Queda 1 unidad' : s <= 5 ? 'Quedan ' + s + ' unidades' : s + ' disponibles'; }

// Ilustración por defecto de cada categoría (si el administrador no sube una foto)
function art(cat){
  const n = String(cat || '').toLowerCase(), L = 'stroke="#c9ccd8" stroke-width="6" stroke-linecap="round"';
  let g;
  if(n.includes('resist')) g = `<path d="M250 150H340M560 150H650" ${L}/><rect x="335" y="105" width="230" height="90" rx="40" fill="#e3c08d"/><rect x="385" y="105" width="22" height="90" fill="#7a3b12"/><rect x="430" y="105" width="22" height="90" fill="#111"/><rect x="475" y="105" width="22" height="90" fill="#d63a2f"/><rect x="520" y="105" width="18" height="90" fill="#d9b13a"/>`;
  else if(n.includes('diod')) g = `<path d="M250 150H350M570 150H650" ${L}/><rect x="350" y="115" width="220" height="70" rx="12" fill="#23252d" stroke="#8f95a8" stroke-width="3"/><rect x="500" y="115" width="26" height="70" fill="#d7dae6"/>`;
  else if(n.includes('led')) g = `<circle cx="450" cy="140" r="96" fill="#ff4d6d" opacity=".22"/><path d="M400 200V140a50 50 0 0 1 100 0V200Z" fill="#ff4d6d"/><rect x="390" y="200" width="120" height="14" rx="4" fill="#ff7a93"/><path d="M425 214V264M475 214V250" ${L}/><ellipse cx="428" cy="118" rx="9" ry="20" fill="#fff" opacity=".45"/>`;
  else if(n.includes('transist')) g = `<path d="M385 215V120a65 65 0 0 1 130 0V215Z" fill="#1c1e25" stroke="#8f95a8" stroke-width="3"/><path d="M415 215V268M450 215V268M485 215V268" ${L}/>`;
  else g = `<rect x="370" y="90" width="160" height="120" rx="14" fill="#1c1e25" stroke="#8f95a8" stroke-width="3"/><circle cx="395" cy="115" r="7" fill="#8f95a8"/><path d="M415 90V68M450 90V68M485 90V68M415 210V232M450 210V232M485 210V232M370 120H348M370 150H348M370 180H348M530 120H552M530 150H552M530 180H552" ${L}/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2f9e"/><stop offset="1" stop-color="#6f5cf2"/></linearGradient></defs><rect width="900" height="300" fill="url(#g)"/><circle cx="790" cy="50" r="90" fill="#fff" opacity=".06"/><circle cx="100" cy="270" r="110" fill="#fff" opacity=".06"/>${g}</svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
const imgOf = p => p.img || art(p.cat);
document.addEventListener('error', e => {   // si una imagen falla, se usa la ilustración de la categoría
  const el = e.target; if(el.tagName !== 'IMG' || el.dataset.fb) return;
  el.dataset.fb = 1; el.src = art(el.dataset.cat);
}, true);

/* ========== B. NAVEGACIÓN: inicio y categorías (usa el # de la dirección para poder volver atrás) ========== */
function go(c){ location.hash = c ? encodeURIComponent(c) : ''; }
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const v = (h === 'Todo' || CATS.includes(h)) ? h : 'home';
  if(v !== state.view){ state.view = v; state.q = ''; $('#q').value = ''; window.scrollTo(0, 0); }
  render();
}
window.addEventListener('hashchange', route);

function renderMenu(){
  $('#menu').innerHTML = ['Todo', ...CATS].map(c => `<button class="mi" data-go="${esc(c)}" ${state.view === c ? 'aria-current="page"' : ''}>${esc(c)}</button>`).join('');
}
function render(){
  renderMenu();
  const home = state.view === 'home';
  $('#home').hidden = !home; $('#catview').hidden = home;
  if(!home) renderCat();
  renderCart();
  document.title = 'Mercadito – ' + (home ? 'componentes electrónicos' : state.view);
}
let loaded = false;
function renderCat(){
  const c = state.view, all = c === 'Todo';
  const base = all ? state.products : state.products.filter(p => p.cat === c);
  $('#btitle').textContent = all ? 'Todos los artículos' : c;
  $('#bcount').textContent = base.length + (base.length === 1 ? ' artículo' : ' artículos');
  const im = $('#bimg'); delete im.dataset.fb; im.dataset.cat = all ? '' : c; im.src = CATIMG[all ? 'Todo' : c] || art(all ? '' : c);
  renderGrid();
}
function renderGrid(){
  if(state.view === 'home') return;
  const all = state.view === 'Todo', q = state.q.trim().toLowerCase();
  let list = (all ? state.products : state.products.filter(p => p.cat === state.view)).filter(p => (p.title + ' ' + p.desc).toLowerCase().includes(q));
  if(state.sort === 'asc') list = [...list].sort((a,b) => a.price - b.price);
  if(state.sort === 'desc') list = [...list].sort((a,b) => b.price - a.price);
  $('#grid').innerHTML = list.length ? list.map(p => { const s = stockOf(p); return `
    <article class="card">
      <img src="${esc(imgOf(p))}" data-cat="${esc(p.cat)}" alt="${esc(p.title)}" data-open="${p.id}" loading="lazy">
      <div class="in">
        <h3 data-open="${p.id}">${esc(p.title)}</h3>
        <div class="price">${fmt(p.price)}</div>
        <div class="stk ${s <= 3 ? 'low' : ''}">${stockLabel(p)}</div>
        <button class="btn primary" data-add="${p.id}" ${s < 1 ? 'disabled' : ''}>${s < 1 ? 'Agotado' : 'Añadir al carrito'}</button>
      </div>
    </article>`; }).join('') : `<p class="empty">${loaded ? (q ? 'No encontramos artículos con esa búsqueda.' : 'Todavía no hay artículos en esta categoría.') : 'Cargando artículos…'}</p>`;
}

/* ========== C. DETALLE DEL PRODUCTO ========== */
function openProduct(id){
  const p = byId(id); if(!p) return;
  const s = stockOf(p), imgs = p.imgs && p.imgs.length ? p.imgs : (p.img ? [p.img] : []);
  $('#prodBody').innerHTML = `
    <div class="mhead"><span class="pill">${esc(p.cat || 'Sin categoría')}</span><button class="x" data-close aria-label="Cerrar">✕</button></div>
    <div class="detail">
      <div><img id="mainImg" src="${esc(imgs[0] || art(p.cat))}" data-cat="${esc(p.cat)}" alt="${esc(p.title)}">${imgs.length > 1 ? `<div class="thumbs">${imgs.map(u => `<img src="${esc(u)}" data-cat="${esc(p.cat)}" data-thumb alt="">`).join('')}</div>` : ''}</div>
      <div class="dinfo">
        <h2>${esc(p.title)}</h2>
        <div class="price big">${fmt(p.price)}</div>
        <div class="stk ${s <= 3 ? 'low' : ''}">${stockLabel(p)}</div>
        <p>${esc(p.desc)}</p>
        <button class="btn primary block" data-buy="${p.id}" ${s < 1 ? 'disabled' : ''}>${s < 1 ? 'Agotado' : 'Comprar ahora'}</button>
        <button class="btn block" data-add="${p.id}" ${s < 1 ? 'disabled' : ''}>Añadir al carrito</button>
      </div>
    </div>`;
  $('#dlgProd').showModal();
}

/* ========== D. CARRITO (se guarda en el navegador: sobrevive a recargas) ========== */
function addToCart(id, n = 1){
  const p = byId(id), max = p ? stockOf(p) : 0, want = (state.cart[id] || 0) + n;
  if(n > 0 && want > max){ toast(max ? 'Solo quedan ' + max + ' disponibles' : 'Producto agotado'); return false; }
  state.cart[id] = want; if(want <= 0) delete state.cart[id];
  store.set('mc_cart', state.cart); renderCart();
}
// Al recibir el catálogo: se quita lo que ya no existe o está agotado y se limitan las cantidades al stock
function reconcileCart(){
  let changed = false;
  Object.keys(state.cart).forEach(k => {
    const p = byId(+k);
    if(!p || stockOf(p) < 1){ delete state.cart[k]; changed = true; }
    else if(state.cart[k] > stockOf(p)){ state.cart[k] = stockOf(p); changed = true; }
  });
  if(changed){ store.set('mc_cart', state.cart); toast('Actualizamos tu carrito según el inventario'); }
}
window.addEventListener('storage', e => { if(e.key === 'mc_cart'){ try{ state.cart = JSON.parse(e.newValue || '{}'); }catch(x){ state.cart = {}; } renderCart(); } });
function cartTotal(){
  const sub = Object.keys(state.cart).map(Number).filter(byId).reduce((s,id) => s + byId(id).price*state.cart[id], 0);
  return sub + (sub && sub < FREE_SHIP ? SHIP : 0);
}
function renderCart(){
  const ids = Object.keys(state.cart).map(Number).filter(byId);
  const sub = ids.reduce((s,id) => s + byId(id).price*state.cart[id], 0), ship = sub === 0 || sub >= FREE_SHIP ? 0 : SHIP;
  const n = ids.reduce((s,id) => s + state.cart[id], 0);
  $('#count').textContent = n; $('#count').hidden = !n;
  $('#items').innerHTML = ids.length ? ids.map(id => { const p = byId(id); return `
    <div class="row">
      <img src="${esc(imgOf(p))}" data-cat="${esc(p.cat)}" alt="">
      <div><b>${esc(p.title)}</b><span class="meta">${fmt(p.price)}</span><br><button class="rm" data-rm="${id}">Eliminar</button></div>
      <div class="qty"><button data-dec="${id}" aria-label="Restar uno">−</button><span>${state.cart[id]}</span><button data-inc="${id}" aria-label="Sumar uno">＋</button></div>
    </div>`; }).join('') : '<p class="empty" style="padding:40px 0">Tu carrito está vacío. Añade un artículo para empezar.</p>';
  $('#sum').innerHTML = ids.length ? `
    <div><span>Subtotal</span><span>${fmt(sub)}</span></div>
    <div><span>Envío</span><span>${ship ? fmt(ship) : 'Gratis'}</span></div>
    ${ship ? `<div class="meta"><span>Envío gratis desde ${fmt(FREE_SHIP)}</span></div>` : ''}
    <div class="tot"><span>Total a pagar</span><span>${fmt(sub + ship)}</span></div>
    <button class="btn primary block" id="checkout">Pagar ahora</button>` : '';
}
function toggleCart(open){ $('#cart').classList.toggle('open', open); $('#veil').classList.toggle('on', open); }

/* ========== E. PAGO CON QR Y PEDIDO ========== */
function qrPlaceholder(){
  const s = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#fff"/><rect x="12" y="12" width="276" height="276" rx="14" fill="none" stroke="#9AA7A0" stroke-width="3" stroke-dasharray="10 8"/><text x="150" y="160" font-size="22" text-anchor="middle" fill="#5B6B64" font-family="sans-serif">QR no disponible</text></svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(s);
}
function openPay(){
  $('#payTotal').textContent = fmt(cartTotal());
  $('#payQr').src = qrImg || qrPlaceholder();
  $('#payHint').textContent = qrImg ? 'Abre la app de tu banco o billetera y escanea el código.' : 'El vendedor aún no ha cargado su código QR de pago.';
  $('#dlgPay').showModal();
}
async function confirmOrder(){
  const name = $('#payName').value.trim(), phone = $('#payPhone').value.trim();
  if(!name || !phone) return toast('Escribe tu nombre y teléfono para enviar el pedido');
  const items = Object.keys(state.cart).map(k => ({id:+k, qty:state.cart[k]}));
  if(online){
    try{ await api('/api/order', {items, name, phone}); }
    catch(e){ toast(e.message); await loadShop(); return; }
  }else{
    items.forEach(it => { const p = byId(it.id); if(p) p.stock = Math.max(0, stockOf(p) - it.qty); });
  }
  state.cart = {}; store.set('mc_cart', state.cart); $('#dlgPay').close(); toggleCart(false);
  toast('Pedido enviado. El vendedor confirmará tu pago.');
  if(online) await loadShop(); else render();
}

/* ========== F. SERVIDOR: catálogo en vivo ========== */
let online = false;
async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(j.error || 'Error del servidor'), {status:r.status});
  return j;
}
async function loadShop(){
  try{
    const j = await api('/api/shop'); online = true; loaded = true;
    state.products = j.products;
    const c = j.config;
    if(c){ if(Array.isArray(c.cats)) CATS = c.cats.filter(x => x.toLowerCase() !== 'todo'); CATIMG = c.catimg || {}; qrImg = c.qr || ''; }
    reconcileCart(); route();
  }catch(e){
    loaded = true;
    if(e.status >= 500){ online = true; toast(e.message); }
    else if(!state.products.length) state.products = SEED;   // sin servidor (archivo local): modo demostración
    route();
  }
}

/* ========== G. ACCESO OCULTO DEL ADMINISTRADOR: 8 clics seguidos en el logo ========== */
function openAdminLogin(){
  let d = $('#dlgAdm');
  if(!d){
    d = document.createElement('dialog'); d.id = 'dlgAdm';
    d.innerHTML = '<form class="mbody" autocomplete="off"><div class="mhead"><h2>Acceso</h2><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div><label>Usuario<input name="u" autocomplete="username" autocapitalize="none"></label><label>Contraseña<input name="p" type="password" autocomplete="current-password"></label><div class="err" role="alert"></div><button class="btn primary block">Entrar</button></form>';
    document.body.appendChild(d);
    d.addEventListener('click', e => { if(e.target === d) d.close(); });
    d.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target;
      try{ const j = await api('/api/auth', {action:'adminLogin', user:f.u.value, password:f.p.value}); localStorage.setItem('mc_admin', j.token); location.href = '/admin'; }
      catch(x){ f.querySelector('.err').textContent = x.status === 429 ? x.message : 'Datos incorrectos'; }
    });
  }
  d.querySelector('form').reset(); d.showModal();
}
let taps = 0, tapTimer;
$('.logo').addEventListener('click', e => {
  e.preventDefault(); go('');
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1500);
  if(taps >= 8){ taps = 0; openAdminLogin(); }
});

/* ========== H. EVENTOS ========== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], [data-thumb]'); if(!t) return;
  const d = t.dataset;
  if(d.thumb !== undefined){ $('#mainImg').src = t.src; return; }
  if(d.close !== undefined) t.closest('dialog').close();
  if(d.go !== undefined) go(d.go);
  if(d.open) openProduct(+d.open);
  if(d.add && addToCart(+d.add) !== false) toast('Añadido al carrito');
  if(d.buy && addToCart(+d.buy) !== false){ $('#dlgProd').close(); toggleCart(true); }
  if(d.inc) addToCart(+d.inc, 1);
  if(d.dec) addToCart(+d.dec, -1);
  if(d.rm){ delete state.cart[d.rm]; store.set('mc_cart', state.cart); renderCart(); }
  if(t.id === 'checkout') openPay();
  if(t.id === 'paid') confirmOrder();
});
$('#btnCart').onclick = () => toggleCart(true);
$('#cartClose').onclick = $('#veil').onclick = () => toggleCart(false);
$('#q').addEventListener('input', e => { state.q = e.target.value; renderGrid(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderGrid(); });
document.querySelectorAll('dialog').forEach(dl => dl.addEventListener('click', e => { if(e.target === dl) dl.close(); }));

/* ========== I. INICIO ========== */
const half = Array(7).fill(`<span>${SLOGAN} ⚡</span>`).join('');
$('#track').innerHTML = half + half;   // dos mitades iguales: la animación recorre una y vuelve a empezar sin saltos
route();
(async () => {
  await loadShop();
  setInterval(() => { if(online && !document.querySelector('dialog[open]')) loadShop(); }, 20000);   // stock en vivo
})();
</script>
</body>
</html>
